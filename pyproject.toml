[project]
name = "wafer-cnn-ui"
version = "0.1.0"
description = "Gradio UI for WaferCNN defect classifier"
requires-python = ">=3.10,<3.13"
dependencies = [
    "torch>=2.2,<3.0",
    "gradio>=5.0,<6.0",
    "pillow>=10.0",
    "numpy>=1.26,<2.3",
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "sqlmodel>=0.0.22,<1.0",
    "python-multipart>=0.0.9,<1.0",
    "opencv-python-headless>=4.13.0.92",
    "psycopg[binary]>=3.2,<4.0",
]
